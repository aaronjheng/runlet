version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned to PR #81 commit (scanner.c fix). Remove after upstream releases a new tag.
      - dependency-name: tree-sitter-lua
      # Pinned to a master revision (SPM support only exists on master). Remove after upstream releases a new tag.
      - dependency-name: tree-sitter-bash
      # swift-tree-sitter only allows tree-sitter < 0.26. Remove after upstream relaxes the constraint.
      - dependency-name: github.com/tree-sitter/tree-sitter
    groups:
      swift:
        patterns:
          - "*"
