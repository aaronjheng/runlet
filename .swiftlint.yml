excluded:
  - .build
  - .swiftpm

opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing

disabled_rules:
  # swift-format (the style authority) places a multiline
  # condition's brace on its own line; the two tools disagree, formatter wins.
  - opening_brace
  - trailing_comma
  - nesting
  - function_body_length
  - type_body_length
  - file_length
  - cyclomatic_complexity

line_length: 140

custom_rules:
  no_direct_userdefaults:
    name: "No direct UserDefaults writes"
    regex: "UserDefaults\\.standard\\.(set|removeObject)\\("
    message: "App config belongs in settings.json (SettingsStore); UserDefaults is UI-state only"
    severity: error
type_name:
  min_length: 2
identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - id
    - ok
